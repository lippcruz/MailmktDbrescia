<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      @media only screen and (max-width: 680px) {
        .stack {
          display: block;
          width: 100% !important;
          text-align: center !important;
        }
        .hide-mobile {
          display: none !important;
        }
        .center-mobile {
          text-align: center !important;
        }
        .qr {
          margin: 0 auto 8px !important;
          width: 82px !important;
          height: auto !important;
          border-width: 2px !important;
        }
        body {
          padding: 8px !important;
        }
      }
    </style>
  </head>
  <body style="margin: 0; padding: 12px; background: #fff">
    <table
      cellpadding="0"
      cellspacing="0"
      width="100%"
      style="
        font-family: Helvetica, Arial, sans-serif;
        background: #fff;
        border-collapse: collapse;
        mso-table-lspace: 0pt;
        mso-table-rspace: 0pt;
      "
    >
      <tr>
        <td align="center">
          <table

            cellspacing="0"

              width: 100%;
              margin: 0 auto;
              border-radius: 8px;
              overflow: hidden;
              box-sizing: border-box;
              border-collapse: collapse;
              mso-table-lspace: 0pt;
              mso-table-rspace: 0pt;
            "
          >

                <table width="100%">
                  <tr>

                          src="https://www.dbrescia.com.br/wp-content/uploads/2026/01/logo_mailmkt.png"
                          alt="D'Brescia"
                          width="160"
                          style="
                            display: block;
                            max-width: 100%;
                            height: auto;
                            border: none;

                    <td style="text-align: right; vertical-align: middle">
                      <div

                          color: #2b2b2b;

                        Marketing
                      </div>

                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td
                style="
                  background: #0b0b0b;
                  border-top: 4px solid #caa46b;
                  padding: 12px 14px;
                  color: #f1efe9;
                "
              >
                <table width="100%">
                  <tr>
                    <td
                      style="
                        vertical-align: middle;
                        width: 22%;
                        max-width: 110px;
                        min-width: 0;
                        padding-right: 12px;
                        text-align: left;
                        box-sizing: border-box;
                      "
                    >
                      <a
                        href="https://linktr.ee/dbrescia"
                        style="text-decoration: none"
                        ><img
                          class="qr"
                          src="https://www.dbrescia.com.br/wp-content/uploads/2026/01/qrcode.png"
                          alt="QR"
                          width="92"
                          style="
                            display: block;
                            border-radius: 6px;
                            border: 3px solid #caa46b;
                          "
                      /></a>
                    </td>
                    <td
                      style="
                        vertical-align: middle;
                        text-align: center;
                        padding: 0 6px;
                        min-width: 0;
                        box-sizing: border-box;
                      "
                      class="center-mobile"
                    ></td>
                    <td
                      style="
                        vertical-align: middle;
                        width: 60%;
                        max-width: 220px;
                        min-width: 0;
                        padding-left: 12px;
                        text-align: right;
                        font-size: 13px;
                        color: #d6b778;
                        box-sizing: border-box;
                      "
                    >
                      <div style="margin-bottom: 6px">
                        📞
                        <a
                          href="tel:+5511981638994"
                          style="color: #f1efe9; text-decoration: none"

                      </div>
                      <div style="margin-bottom: 6px">
                        ✉️
                        <a
                          href="mailto:marketing@dbresciachurrascaria.com.br"

                      </div>
                      <div style="margin-bottom: 6px">
                        🌐
                        <a
                          href="https://www.dbrescia.com.br"
                          style="color: #f1efe9; text-decoration: none"
                          >www.dbrescia.com.br</a
                        >

                  </tr>
                  <tr>
                    <td
                      colspan="3"
                      style="
                        text-align: center;
                        padding-top: 10px;
                        font-size: 11px;
                        color: #e9dfcf;
                        word-break: break-word;
                        white-space: normal;
                      "
                    >
                      Faria Lima • Paraíso • Vila Mariana • Morumbi • Marginal
                      Tietê • Santo André • SãoBernardo • Guarulhos
                    </td>

                </table>

          </table>

      </tr>
    </table>

</html>
